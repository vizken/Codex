<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roso Chair V5</title><style>body{margin:0;background:#0c1420;color:#eaf1f7;font:15px system-ui}header{padding:16px}h1{margin:0;font-size:22px}main{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;padding:12px}.card{border:1px solid #40546a;border-radius:12px;overflow:hidden;background:#142233}h2{font-size:14px;padding:12px;margin:0;border-bottom:1px solid #40546a}.ref{width:100%;display:block}#stage{height:65vh;min-height:350px;position:relative}canvas{width:100%;height:100%;display:block;touch-action:none}#status{position:absolute;top:10px;left:10px;background:#07121bc9;padding:8px;border-radius:6px}button{margin:7px;background:#29435e;color:white;border:1px solid #647b92;padding:10px;border-radius:7px}p{padding:0 12px;line-height:1.6;color:#c7d5e1}@media(max-width:760px){main{grid-template-columns:1fr}#stage{height:55vh}}</style><header><h1>Roso Chair · V5</h1><div>非對稱自由曲面｜原圖對照｜概念重建</div></header><main><section class="card"><h2>01 · 原始圖面</h2><img class="ref" src="reference.png" alt="Roso Chair reference drawing" onerror="this.style.display='none';document.getElementById('refnote').hidden=false"><p id="refnote" hidden>原始參考圖尚未部署；可與對話中的原圖對照。</p><p>本版曲面以可編輯的多斷面控制點重建。原始圖未提供完整三維尺寸，因此屬近似幾何。</p></section><section class="card"><h2>02 · V5 三維曲面</h2><div id="stage"><canvas id="c"></canvas><span id="status">初始化中…</span></div><div><button id="reset">透視</button><button id="top">俯視</button><button id="side">側視</button><button id="wire">網格</button></div><p>手指拖曳旋轉，雙指縮放。X 向名義長度 2000 mm。CAD NURBS 與 Web 近似網格使用相同斷面控制參數。</p></section></main><script type="module">
const s=document.getElementById('status');
try{
const T=await import('https://cdn.jsdelivr.net/npm/three@0.164.1/+esm');
const {OrbitControls}=await import('https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js/+esm');
const stations=[[-1000,-80,95,20,40,55],[-820,-145,180,70,150,200],[-580,-260,270,130,365,455],[-330,-370,355,195,530,600],[-80,-385,340,245,455,480],[170,-285,275,190,280,275],[410,-205,245,135,155,160],[690,-160,205,95,130,170],[1000,-125,155,55,100,160]],tw=[0,10,40,65,35,-15,-35,-15,0];
function interp(x,col){let i=0;while(i<stations.length-2&&x>stations[i+1][0])i++;const p0=stations[Math.max(0,i-1)],p1=stations[i],p2=stations[i+1],p3=stations[Math.min(stations.length-1,i+2)];const t=Math.max(0,Math.min(1,(x-p1[0])/(p2[0]-p1[0])));return .5*((2*p1[col])+(-p0[col]+p2[col])*t+(2*p0[col]-5*p1[col]+4*p2[col]-p3[col])*t*t+(-p0[col]+3*p1[col]-3*p2[col]+p3[col])*t*t*t)}
const pos=[],idx=[],N=120,M=40;
for(let i=0;i<=N;i++){let x=-1000+2000*i/N,yl=interp(x,1),yr=interp(x,2),zl=interp(x,3),zc=interp(x,4),zr=interp(x,5);for(let j=0;j<=M;j++){let u=j/M,y=yl*(1-u)+yr*u,z=zl*(1-u)+zr*u+4*u*(1-u)*(zc-(zl+zr)/2);pos.push(x,y,z)}}
for(let i=0;i<N;i++)for(let j=0;j<M;j++){let a=i*(M+1)+j,b=a+M+1;idx.push(a,b,a+1,b,b+1,a+1)}
const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
const scene=new T.Scene();scene.background=new T.Color('#0d1b2a');scene.add(new T.HemisphereLight(0xffffff,0x4e6174,2));let light=new T.DirectionalLight(0xffffff,2);light.position.set(700,-500,1100);scene.add(light);
const mat=new T.MeshStandardMaterial({color:0xc5ccd5,roughness:.58,metalness:.12,side:T.DoubleSide});scene.add(new T.Mesh(g,mat));
const c=document.getElementById('c'),renderer=new T.WebGLRenderer({canvas:c,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));const cam=new T.PerspectiveCamera(45,1,1,10000),ctrl=new OrbitControls(cam,c);ctrl.enableDamping=true;const target=new T.Vector3(0,0,240);ctrl.target.copy(target);
function view(x,y,z){cam.position.set(x,y,z);cam.lookAt(target);ctrl.update()}view(1700,-1900,1150);
new ResizeObserver(()=>{let w=c.clientWidth,h=c.clientHeight;if(w&&h){renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}}).observe(c);
function loop(){requestAnimationFrame(loop);ctrl.update();renderer.render(scene,cam)}loop();
document.getElementById('reset').onclick=()=>view(1700,-1900,1150);document.getElementById('top').onclick=()=>view(0,0,2800);document.getElementById('side').onclick=()=>view(0,-2800,240);document.getElementById('wire').onclick=()=>{mat.wireframe=!mat.wireframe};s.textContent='WebGL 啟動｜'+pos.length/3+' 頂點';
}catch(e){s.textContent='錯誤：'+e.message}
</script></html>
