<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roso Chair V5</title><style>*{box-sizing:border-box}body{margin:0;background:#101a27;color:#edf4fb;font:15px system-ui,-apple-system,sans-serif}header{padding:18px;border-bottom:1px solid #364b61}h1{margin:0;font-size:21px}header p{margin:8px 0 0;color:#adc1d5}.main{max-width:1100px;margin:auto;padding:14px}.card{border:1px solid #3d5369;border-radius:12px;overflow:hidden;background:#192838}.bar{padding:12px;border-bottom:1px solid #3d5369;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}#frame{position:relative;height:68vh;min-height:360px}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;top:10px;left:10px;max-width:90%;background:#091625dd;padding:8px 11px;border-radius:7px;font-size:13px}.buttons{display:flex;flex-wrap:wrap;gap:9px;padding:12px}button{background:#31516d;color:white;border:1px solid #6688a8;border-radius:8px;padding:10px 14px;min-height:44px}.note{color:#adc1d5;line-height:1.65;padding:0 15px 15px}@media(max-width:650px){#frame{height:58vh;min-height:350px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"}}</script></head><body><header><h1>Roso Chair · V5</h1><p>幾何規則：沿彎曲中心線掃掠，截面逐步扭轉 180°</p></header><main class="main"><section class="card"><div class="bar"><strong>Three.js 互動曲面</strong><span>概念重建 · 長度 2000 mm</span></div><div id="frame"><canvas id="view"></canvas><div id="status">初始化 WebGL…</div></div><div class="buttons"><button id="reset">透視</button><button id="top">俯視</button><button id="side">側視</button><button id="wire">顯示網格</button><button id="axis">隱藏座標軸</button></div><div class="note">單指拖曳旋轉，雙指縮放。這一版直接由 V5 Python 相同的參數公式生成網格，無須另外載入 GLB，因此不會發生 GLB 相對路徑遺失的問題。原始設計參考圖尚未發布在本頁；本模型仍是概念重建，尚未驗證與原圖吻合。</div></section></main><script type="module">
const status=document.getElementById('status');
try{
const THREE=await import('three');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const canvas=document.getElementById('view');const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color('#152333');scene.add(new THREE.HemisphereLight(0xffffff,0x62788d,2.3));const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(900,1300,1400);scene.add(sun);
const camera=new THREE.PerspectiveCamera(44,1,1,10000);const orbit=new OrbitControls(camera,canvas);orbit.enableDamping=true;
const nt=90,nu=24,positions=[],indices=[];
const smooth=t=>3*t*t-2*t*t*t;
for(let i=0;i<=nt;i++){let t=i/nt,x=2000*(t-.5),cy=110*Math.sin(Math.PI*t)+60*Math.sin(2*Math.PI*t),cz=75*Math.sin(Math.PI*t)+85*Math.exp(-Math.pow((t-.38)/.19,2)),a=Math.PI*smooth(t),w=520*(.68+.36*Math.sin(Math.PI*t)**2);
for(let j=0;j<=nu;j++){let u=j/nu,q=(u-.5)*w;positions.push(x,cy+q*Math.cos(a),cz+q*Math.sin(a)+38*Math.sin(Math.PI*t)*(1-(2*u-1)**2));}}
for(let i=0;i<nt;i++)for(let j=0;j<nu;j++){let a=i*(nu+1)+j,b=a+nu+1;indices.push(a,b,a+1,a+1,b,b+1);}
const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geometry.setIndex(indices);geometry.computeVertexNormals();
const material=new THREE.MeshStandardMaterial({color:0xcbd3dd,roughness:.57,metalness:.08,side:THREE.DoubleSide});const mesh=new THREE.Mesh(geometry,material);scene.add(mesh);
const axes=new THREE.AxesHelper(300);scene.add(axes);const center=new THREE.Box3().setFromObject(mesh).getCenter(new THREE.Vector3());orbit.target.copy(center);
function view(x,y,z){camera.position.copy(center).add(new THREE.Vector3(x,y,z));camera.lookAt(center);orbit.update();}
view(1750,-1900,1100);document.getElementById('reset').onclick=()=>view(1750,-1900,1100);document.getElementById('top').onclick=()=>view(0,0,2600);document.getElementById('side').onclick=()=>view(0,-2600,350);
document.getElementById('wire').onclick=e=>{material.wireframe=!material.wireframe;e.currentTarget.textContent=material.wireframe?'隱藏網格':'顯示網格';};
document.getElementById('axis').onclick=e=>{axes.visible=!axes.visible;e.currentTarget.textContent=axes.visible?'隱藏座標軸':'顯示座標軸';};
function resize(){let w=canvas.clientWidth,h=canvas.clientHeight;if(w&&h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
new ResizeObserver(resize).observe(canvas);resize();status.textContent='WebGL 已啟動｜'+positions.length/3+' 頂點｜'+indices.length/3+' 三角面';
function loop(){requestAnimationFrame(loop);orbit.update();renderer.render(scene,camera);}loop();
}catch(err){status.textContent='3D 啟動失敗：'+String(err.message||err);console.error(err);}
</script></body></html>
